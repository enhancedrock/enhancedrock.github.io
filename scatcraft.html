<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Add to Minecraft</title>
  <style>
    html, body {
      width: 100%;
      height: 100%;
      margin: 0;
    }

    body {
      background: rgb(20, 20, 20);
      display: grid;
      place-items: center;
    }

    .button {
      width: 75vw;
      height: 10vh;
      box-sizing: border-box;
      display: grid;
      place-items: center;
      background: rgb(240, 240, 240);
      color: black;
      border: 1px solid black;
      text-decoration: none;
      font: inherit;
      cursor: pointer;
      font-family: 'Gill Sans', 'Gill Sans MT', Calibri, 'Trebuchet MS', sans-serif;
      font-size: 4vh;
      border-radius: 2.5vh;
    }
  </style>
</head>
<body>
  <a class="button" id="addButton"
     href="minecraft://?addExternalServer=ScatCraft|scatcraft.my.pebble.host:8016">
    Add to Minecraft
  </a>

  <script>
    window.addEventListener("load", () => {
      window.location.href =
        "minecraft://?addExternalServer=ScatCraft|scatcraft.my.pebble.host:8016";
    });
  </script>
</body>
</html>
